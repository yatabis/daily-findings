name: Web UIのビルド

on:
  push:
    branches:
      - main
    paths:
      - "content/findings/**"
      - "src/**"
      - "astro.config.mjs"
      - "package.json"
      - "tsconfig.json"
      - "wrangler.jsonc"
      - ".github/workflows/build-web.yml"
  pull_request:
    paths:
      - "content/findings/**"
      - "src/**"
      - "astro.config.mjs"
      - "package.json"
      - "tsconfig.json"
      - "wrangler.jsonc"
      - ".github/workflows/build-web.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsを設定
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: 依存関係をインストール
        run: npm install

      - name: Web UIをビルド
        run: npm run build
