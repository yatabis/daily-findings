name: Findingのスキーマ検証

on:
  push:
    paths:
      - "content/findings/**"
      - "schema/finding.schema.json"
      - "scripts/validate_findings.py"
  pull_request:
    paths:
      - "content/findings/**"
      - "schema/finding.schema.json"
      - "scripts/validate_findings.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonを設定
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 依存関係をインストール
        run: python -m pip install "jsonschema[format]>=4.23,<5"

      - name: Findingを検証
        run: python scripts/validate_findings.py
