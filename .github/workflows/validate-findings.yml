name: Findingのスキーマ検証

on:
  push:
    paths:
      - "content/findings/**"
      - "schema/finding.schema.json"
      - "scripts/validate_findings.py"
  pull_request:
    paths:
      - "content/findings/**"
      - "schema/finding.schema.json"
      - "scripts/validate_findings.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pythonを設定
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 依存関係をインストール
        run: python -m pip install "jsonschema[format]>=4.23,<5"

      - name: 検証対象を決定
        id: targets
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CONTROL_CHANGES=$(git diff --name-only "$BASE" "$GITHUB_SHA" -- schema/finding.schema.json scripts/validate_findings.py)
          if [[ -n "$CONTROL_CHANGES" ]]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t FILES < <(git diff --diff-filter=AM --name-only "$BASE" "$GITHUB_SHA" -- 'content/findings/*.json')
          if (( ${#FILES[@]} == 0 )); then
            echo "mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "mode=files" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${FILES[@]}" > /tmp/finding-files.txt

      - name: Findingを全件検証
        if: steps.targets.outputs.mode == 'all'
        run: python scripts/validate_findings.py

      - name: 変更されたFindingを検証
        if: steps.targets.outputs.mode == 'files'
        shell: bash
        run: |
          mapfile -t FILES < /tmp/finding-files.txt
          python scripts/validate_findings.py "${FILES[@]}"

      - name: 検証対象なし
        if: steps.targets.outputs.mode == 'none'
        run: echo "検証対象のFindingはありません。"
